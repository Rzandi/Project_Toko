<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceEase - API Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
        }
        .card h3 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: monospace;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:active {
            transform: translateY(0);
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .response {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
            font-size: 12px;
            font-family: monospace;
            color: #333;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .response.error {
            background: #ffe0e0;
            border-color: #ff6b6b;
            color: #c92a2a;
        }
        .response.success {
            background: #e0ffe0;
            border-color: #51cf66;
            color: #2b8a3e;
        }
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        .status.loading {
            background: #ffd700;
            color: #333;
        }
        .status.ok {
            background: #51cf66;
            color: white;
        }
        .status.error {
            background: #ff6b6b;
            color: white;
        }
        .info-box {
            background: #e7f5ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1864ab;
        }
        .section {
            margin-bottom: 40px;
        }
        .section-title {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 InvoiceEase API Demo</h1>
        <p class="subtitle">Test backend API endpoints</p>

        <div class="info-box">
            ℹ️ <strong>API Base URL:</strong> <code id="baseUrl"></code>
        </div>

        <!-- AUTH Section -->
        <div class="section">
            <div class="section-title">🔐 Authentication</div>
            
            <div class="grid">
                <div class="card">
                    <h3>Register</h3>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="test@example.com" value="test@invoiceease.local">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="Password" value="TestPass123!">
                    </div>
                    <button onclick="register()">Register</button>
                    <div id="regResponse"></div>
                </div>

                <div class="card">
                    <h3>Login</h3>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="test@example.com" value="test@invoiceease.local">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Password" value="TestPass123!">
                    </div>
                    <button onclick="login()">Login</button>
                    <div id="loginResponse"></div>
                </div>
            </div>
        </div>

        <!-- Transactions Section -->
        <div class="section">
            <div class="section-title">💳 Transactions</div>
            
            <div class="grid">
                <div class="card">
                    <h3>Get Transactions</h3>
                    <button onclick="getTransactions()">Fetch All</button>
                    <div id="getTransResponse"></div>
                </div>

                <div class="card">
                    <h3>Health Check</h3>
                    <button onclick="healthCheck()">Check Status</button>
                    <div id="healthResponse"></div>
                </div>
            </div>
        </div>

        <!-- Config Section -->
        <div class="section">
            <div class="section-title">⚙️ Configuration</div>
            <div class="card">
                <div class="input-group">
                    <label>API Base URL</label>
                    <input type="text" id="apiUrl" placeholder="https://..." value="https://projecttoko-production.up.railway.app/api/v1">
                </div>
                <div class="input-group">
                    <label>Token (for auth requests)</label>
                    <input type="text" id="token" placeholder="JWT token" readonly>
                </div>
                <button onclick="saveConfig()">Save Config</button>
                <button onclick="clearToken()" style="background: #ff6b6b;">Clear Token</button>
            </div>
        </div>
    </div>

    <script>
        // Load config from localStorage
        function loadConfig() {
            const baseUrl = localStorage.getItem('apiBaseUrl') || 'https://projecttoko-production.up.railway.app/api/v1';
            const token = localStorage.getItem('authToken') || '';
            
            document.getElementById('apiUrl').value = baseUrl;
            document.getElementById('token').value = token;
            document.getElementById('baseUrl').textContent = baseUrl;
        }

        function saveConfig() {
            const baseUrl = document.getElementById('apiUrl').value;
            localStorage.setItem('apiBaseUrl', baseUrl);
            document.getElementById('baseUrl').textContent = baseUrl;
            showStatus('Config saved!', 'ok');
        }

        function clearToken() {
            localStorage.removeItem('authToken');
            document.getElementById('token').value = '';
            showStatus('Token cleared!', 'ok');
        }

        function getBaseUrl() {
            return document.getElementById('apiUrl').value;
        }

        function getToken() {
            return localStorage.getItem('authToken') || '';
        }

        function setToken(token) {
            localStorage.setItem('authToken', token);
            document.getElementById('token').value = token;
        }

        async function register() {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const responseEl = document.getElementById('regResponse');

            if (!email || !password) {
                showResponse(responseEl, 'Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${getBaseUrl()}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    showResponse(responseEl, JSON.stringify(data, null, 2), 'success');
                } else {
                    showResponse(responseEl, JSON.stringify(data, null, 2), 'error');
                }
            } catch (error) {
                showResponse(responseEl, `Error: ${error.message}`, 'error');
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const responseEl = document.getElementById('loginResponse');

            if (!email || !password) {
                showResponse(responseEl, 'Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${getBaseUrl()}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    setToken(data.token);
                    showResponse(responseEl, JSON.stringify(data, null, 2), 'success');
                } else {
                    showResponse(responseEl, JSON.stringify(data, null, 2), 'error');
                }
            } catch (error) {
                showResponse(responseEl, `Error: ${error.message}`, 'error');
            }
        }

        async function getTransactions() {
            const responseEl = document.getElementById('getTransResponse');
            const token = getToken();

            if (!token) {
                showResponse(responseEl, 'Please login first!', 'error');
                return;
            }

            try {
                const response = await fetch(`${getBaseUrl()}/transactions`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                if (response.ok) {
                    showResponse(responseEl, JSON.stringify(data, null, 2), 'success');
                } else {
                    showResponse(responseEl, JSON.stringify(data, null, 2), 'error');
                }
            } catch (error) {
                showResponse(responseEl, `Error: ${error.message}`, 'error');
            }
        }

        async function healthCheck() {
            const responseEl = document.getElementById('healthResponse');

            try {
                const response = await fetch(`${getBaseUrl().replace('/api/v1', '')}/health`, {
                    method: 'GET'
                });

                const data = await response.json();
                if (response.ok) {
                    showResponse(responseEl, JSON.stringify(data, null, 2), 'success');
                } else {
                    showResponse(responseEl, JSON.stringify(data, null, 2), 'error');
                }
            } catch (error) {
                showResponse(responseEl, `Error: ${error.message}`, 'error');
            }
        }

        function showResponse(element, content, type) {
            element.innerHTML = `<div class="response ${type}">${content}</div>`;
        }

        function showStatus(message, type) {
            alert(message);
        }

        // Load config on page load
        window.addEventListener('load', loadConfig);
    </script>
</body>
</html>
